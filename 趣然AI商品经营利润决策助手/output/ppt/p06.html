<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整条建议审核，分动作执行</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --ink: #101214;
      --muted: #5C6470;
      --panel: #EDEDED;
      --rule: #B8BCC4;
      --accent: #6DCBF4;
      --accent-strong: #3D8DFF;
      --font: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --radius-sm: 6px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--panel);
      color: var(--ink);
      font-family: var(--font);
      overflow-x: hidden;
    }
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      min-height: 1080px;
      overflow: hidden;
      transform-origin: top left;
      background: var(--bg);
    }
    .slide {
      height: 100%;
      padding: 72px 96px 42px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 34px;
    }
    .chapter {
      margin: 0 0 14px;
      color: var(--accent-strong);
      font-size: 18px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: .18em;
    }
    h1 {
      max-width: 1540px;
      margin: 0;
      font-size: 68px;
      line-height: 1.08;
      letter-spacing: -.035em;
      font-weight: 760;
    }
    .content {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 186px;
      gap: 26px;
    }
    .process {
      min-height: 0;
      display: grid;
      grid-template-columns: 220px 42px 286px 42px 304px 42px 438px 42px 220px;
      align-items: center;
      justify-content: space-between;
    }
    .arrow {
      display: grid;
      place-items: center;
      color: var(--accent-strong);
      font-size: 34px;
      font-weight: 700;
    }
    .node {
      min-height: 300px;
      padding: 26px;
      border: 1px solid var(--rule);
      border-radius: var(--radius-md);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .node.approval {
      border: 3px solid var(--accent-strong);
      background: var(--accent);
    }
    .step-no {
      color: var(--accent-strong);
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .approval .step-no { color: var(--ink); }
    .node h2 {
      margin: 44px 0 12px;
      font-size: 31px;
      line-height: 1.18;
      font-weight: 740;
    }
    .node p {
      margin: 0;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.42;
    }
    .approval p { color: var(--ink); }
    .approval-mark {
      margin-top: auto;
      padding-top: 17px;
      border-top: 1px solid var(--accent-strong);
      font-size: 21px;
      line-height: 1.3;
      font-weight: 760;
    }
    .node.lanes {
      padding: 22px;
    }
    .lanes h2 {
      margin: 18px 0 16px;
    }
    .lane-grid {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .lane {
      min-height: 138px;
      padding: 17px;
      border-top: 6px solid var(--accent-strong);
      background: var(--panel);
    }
    .lane b {
      display: block;
      margin-bottom: 10px;
      font-size: 23px;
      line-height: 1.1;
    }
    .lane span {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.35;
    }
    .controls {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 24px;
    }
    .atomic,
    .states {
      min-width: 0;
      padding: 26px 30px;
      border-radius: var(--radius-md);
    }
    .atomic {
      display: grid;
      grid-template-columns: 170px 1fr;
      align-items: center;
      background: var(--accent);
    }
    .control-label {
      font-size: 19px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .atomic-rule {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
    }
    .atomic-rule strong {
      font-size: 31px;
      line-height: 1.18;
    }
    .atomic-rule i {
      font-style: normal;
      color: var(--accent-strong);
      font-size: 32px;
      font-weight: 800;
    }
    .atomic-rule span {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.25;
    }
    .states {
      border: 1px solid var(--rule);
      background: var(--bg);
    }
    .state-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .state {
      padding: 0 18px;
      border-left: 1px solid var(--rule);
    }
    .state:first-child {
      padding-left: 0;
      border-left: 0;
    }
    .state b {
      display: block;
      font-size: 23px;
      line-height: 1.15;
    }
    .state span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.2;
    }
    .footer {
      height: 44px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: end;
      gap: 26px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 18px;
    }
    .footer-brand { padding-top: 14px; }
    .page-no {
      padding-top: 14px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .nav {
      display: flex;
      gap: 8px;
      padding-top: 8px;
    }
    .nav a {
      width: 46px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      font-size: 20px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="slide">
      <header>
        <p class="chapter">PRODUCT DESIGN / 02</p>
        <h1>整条建议只审核一次，动作按角色分开执行</h1>
      </header>

      <section class="content" aria-label="整体审核与分动作执行流程">
        <div class="process">
          <article class="node">
            <span class="step-no">01</span>
            <h2>导入校验</h2>
            <p>读取 SPU 经营表</p>
          </article>
          <div class="arrow" aria-hidden="true">→</div>

          <article class="node">
            <span class="step-no">02</span>
            <h2>规则判定与解释</h2>
            <p>同时生成经营动作与库存动作</p>
          </article>
          <div class="arrow" aria-hidden="true">→</div>

          <article class="node approval">
            <span class="step-no">03 / 唯一审核点</span>
            <h2>主管整体审核</h2>
            <p>整条建议一次通过或驳回</p>
            <div class="approval-mark">通过后才激活执行任务</div>
          </article>
          <div class="arrow" aria-hidden="true">→</div>

          <article class="node lanes">
            <span class="step-no">04 / 双泳道</span>
            <h2>分角色执行</h2>
            <div class="lane-grid">
              <div class="lane"><b>运营</b><span>经营动作</span></div>
              <div class="lane"><b>采购计划</b><span>补货 / 禁止补货</span></div>
            </div>
          </article>
          <div class="arrow" aria-hidden="true">→</div>

          <article class="node">
            <span class="step-no">05</span>
            <h2>结果回填</h2>
            <p>分别记录，统一追溯</p>
          </article>
        </div>

        <div class="controls">
          <div class="atomic">
            <div class="control-label">原子冲突保护</div>
            <div class="atomic-rule">
              <strong>止损 / 清仓</strong>
              <i>+</i>
              <strong>禁止补货</strong>
              <span>规则阶段同时生成，不能拆开通过</span>
            </div>
          </div>

          <div class="states">
            <div class="control-label">三层状态</div>
            <div class="state-grid">
              <div class="state"><b>建议级</b><span>审核状态</span></div>
              <div class="state"><b>动作级</b><span>执行状态</span></div>
              <div class="state"><b>总览</b><span>只读汇总</span></div>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span class="footer-brand">AI 商品经营与利润决策助手</span>
        <span class="page-no">06 / 11</span>
        <nav class="nav" aria-label="幻灯片导航">
          <a href="p05.html" aria-label="上一页">←</a>
          <a href="p07.html" aria-label="下一页">→</a>
        </nav>
      </footer>
    </main>
  </div>

  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p05.html';
      if (event.key === 'ArrowRight') location.href = 'p07.html';
    });
  </script>
</body>
</html>
