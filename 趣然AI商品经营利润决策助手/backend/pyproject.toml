[project]
name = "quran-profit-decision"
version = "0.1.0"
description = "趣然 AI 商品经营与利润决策助手生产后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.128.8",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "python-multipart==0.0.22",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.39.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.5",
  "types-openpyxl==3.1.5.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
