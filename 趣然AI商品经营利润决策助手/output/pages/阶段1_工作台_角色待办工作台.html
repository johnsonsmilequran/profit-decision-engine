:root {
  /* ─── Surface (3 levels) ─── */
  --bg: #F7F5F0;
  --surface: #FFFFFF;

  --surface-overlay: var(--surface);

  /* ─── Foreground (4 levels) ─── */
  --fg: #18202B;
  --fg-2: var(--fg);
  --muted: #536170;

  /* ─── Border (2 levels) ─── */
  --border: #C8CDD3;

  /* ─── Accent ─── */
  --accent: #3347A8;
  --accent-on: #FFFFFF;
  --accent-hover: color-mix(in oklab, var(--accent), black 8%);
  --accent-active: color-mix(in oklab, var(--accent), black 14%);

  /* ─── Semantic ─── */
  --success: #087A62;
  --warn: #9A5B00;
  --danger: #B42318;

  /* ─── Typography — fonts ─── */
  --font-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Roboto Mono", "SFMono-Regular", Consolas, monospace;

  /* ─── Type scale ─── */
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 32px;
  --text-4xl: 48px;

  /* ─── Leading & Tracking ─── */
  --leading-body: 1.65;
  --leading-tight: 1.25;
  --tracking-display: -0.025em;

  /* ─── Spacing (4px base) ─── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* ─── Section rhythm ─── */
  --section-y-desktop: 80px;
  --section-y-tablet: 64px;
  --section-y-phone: 48px;

  /* ─── Radius ─── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  /* ─── Surface elevation ─── */
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 2px 8px color-mix(in oklab, var(--fg), transparent 92%);
  --elev-float: 0 8px 32px color-mix(in oklab, var(--fg), transparent 88%);

  /* ─── Focus ─── */
  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);

  /* ─── Motion ─── */
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ─── */
  --container-max: 1320px;
  --container-gutter-desktop: 32px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

<script data-page-wiring>
(() => {
  const routes = {"PAGE-F08-01":"阶段1_历史追溯_历史追溯索引.html","PAGE-F06-01":"阶段1_审核执行_建议审核表单.html","PAGE-F06-02":"阶段1_审核执行_经营动作执行表单.html","PAGE-F06-04":"阶段1_审核执行_经营结果记录表单.html","PAGE-F06-03":"阶段1_审核执行_采购动作执行表单.html","PAGE-F00-01":"阶段1_工作台_角色待办工作台.html","PAGE-F01-01":"阶段1_数据批次_批次列表.html","PAGE-F01-03":"阶段1_数据批次_批次详情与校验结果.html","PAGE-F01-02":"阶段1_数据批次_新建数据导入.html","PAGE-F05-02":"阶段1_行动清单_建议详情.html","PAGE-F05-01":"阶段1_行动清单_行动清单列表.html","PAGE-F07-02":"阶段1_身份权限_权限不足.html","PAGE-F07-01":"阶段1_身份权限_钉钉认证门禁.html"};
  const labels = {"工作台":"PAGE-F00-01","数据批次":"PAGE-F01-01","批次管理":"PAGE-F01-01","行动清单":"PAGE-F05-01","历史追溯":"PAGE-F08-01","新建导入":"PAGE-F01-02","导入数据":"PAGE-F01-02","查看批次":"PAGE-F01-03","批次详情":"PAGE-F01-03","查看清单":"PAGE-F05-01","查看详情":"PAGE-F05-02","建议详情":"PAGE-F05-02","审核建议":"PAGE-F06-01","去审核":"PAGE-F06-01","执行经营动作":"PAGE-F06-02","确认经营动作":"PAGE-F06-02","执行采购动作":"PAGE-F06-03","确认采购动作":"PAGE-F06-03","记录经营结果":"PAGE-F06-04","返回建议详情":"PAGE-F05-02","返回工作台":"PAGE-F00-01"};
  const candidates = document.querySelectorAll('a[href="#"], button');
  for (const el of candidates) {
    const text = el.textContent.replace(/\s+/g, ' ').trim();
    const key = Object.keys(labels).find((label) => text === label || text.includes(label));
    const pageId = el.dataset.targetPage || (key && labels[key]);
    if (!pageId || !routes[pageId]) continue;
    if (el.tagName === 'A') el.href = routes[pageId];
    else el.addEventListener('click', () => { location.href = routes[pageId]; });
  }
})();
</script>
