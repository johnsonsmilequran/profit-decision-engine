name: profit-decision

services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: profit_decision
      POSTGRES_USER: profit_decision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profit_decision -d profit_decision"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { TARGET: migrate }
    environment:
      DATABASE_URL: postgres://profit_decision:${POSTGRES_PASSWORD}@db:5432/profit_decision?sslmode=disable
    volumes:
      - ./backend/migrations:/app/migrations:ro
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { TARGET: api }
    environment:
      API_ADDRESS: :8081
      DATABASE_URL: postgres://profit_decision:${POSTGRES_PASSWORD}@db:5432/profit_decision?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      IMPORT_FILE_DIR: /data/imports
    volumes:
      - import-files:/data/imports
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { TARGET: worker }
    environment:
      DATABASE_URL: postgres://profit_decision:${POSTGRES_PASSWORD}@db:5432/profit_decision?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      IMPORT_FILE_DIR: /data/imports
    volumes:
      - import-files:/data/imports
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      api: { condition: service_started }

volumes:
  postgres18-data:
  import-files:
