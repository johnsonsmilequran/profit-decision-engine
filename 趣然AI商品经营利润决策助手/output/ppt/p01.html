<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 商品经营与利润决策助手</title>
  <style>
:root {
  --bg: #f7f8f6;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --ink: #101713;
  --muted: #657069;
  --line: #d8ded9;
  --accent: #126b4d;
  --accent-2: #dceee6;
  --success: #23845d;
  --warning: #b56a19;
  --danger: #b23a3a;
  --shadow: 0 22px 70px rgba(16, 23, 19, 0.10);
  --radius-sm: 14px;
  --radius-md: 24px;
  --radius-lg: 38px;
}

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--surface-2);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      overflow-x: hidden;
    }
    .stage {
      position: relative;
      width: 1920px;
      min-height: 1080px;
      height: 1080px;
      overflow: hidden;
      transform-origin: top left;
      background: var(--bg);
    }
    .stage::before {
      content: "";
      position: absolute;
      left: 88px;
      top: 0;
      width: 2px;
      height: 100%;
      background: var(--line);
    }
    .copy {
      position: absolute;
      left: 148px;
      top: 102px;
      width: 900px;
      height: 828px;
      display: flex;
      flex-direction: column;
    }
    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .14em;
    }
    h1 {
      margin: 98px 0 34px;
      max-width: 880px;
      font-size: 92px;
      line-height: 1.06;
      letter-spacing: -.045em;
      font-weight: 760;
    }
    .subtitle {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 31px;
      line-height: 1.55;
      font-weight: 500;
    }
    .scope {
      margin-top: auto;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.45;
    }
    .scope strong { color: var(--ink); font-weight: 700; }
    .scope-mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--accent);
    }
    .decision-field {
      position: absolute;
      right: 110px;
      top: 88px;
      width: 650px;
      height: 850px;
      padding: 62px 64px 54px;
      border-radius: var(--radius-lg);
      background: var(--accent);
      color: var(--surface);
      box-shadow: var(--shadow);
    }
    .field-label {
      margin: 0 0 56px;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .13em;
      color: var(--accent-2);
    }
    .path {
      position: relative;
      margin-left: 8px;
      padding-left: 58px;
      display: grid;
      gap: 46px;
    }
    .path::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 16px;
      bottom: 18px;
      width: 2px;
      background: var(--accent-2);
    }
    .path-step {
      position: relative;
      min-height: 112px;
    }
    .path-step::before {
      content: "";
      position: absolute;
      left: -58px;
      top: 7px;
      width: 22px;
      height: 22px;
      border: 5px solid var(--accent);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 0 0 2px var(--accent-2);
    }
    .step-no {
      display: block;
      margin-bottom: 12px;
      color: var(--accent-2);
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .1em;
    }
    .path-step strong {
      display: block;
      font-size: 34px;
      line-height: 1.22;
      font-weight: 730;
    }
    .path-step span:last-child {
      display: block;
      margin-top: 8px;
      color: var(--accent-2);
      font-size: 23px;
      line-height: 1.45;
    }
    .field-conclusion {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 54px;
      margin: 0;
      padding-top: 28px;
      border-top: 1px solid var(--accent-2);
      font-size: 27px;
      line-height: 1.48;
      font-weight: 650;
    }
    .page-index {
      position: absolute;
      left: 148px;
      bottom: 54px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .nav {
      position: absolute;
      right: 110px;
      bottom: 42px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 3;
    }
    .nav a {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent-2);
      border-radius: 50%;
      color: var(--surface);
      background: var(--accent);
      text-decoration: none;
      font-size: 28px;
      line-height: 1;
    }
    .nav a[aria-disabled="true"] {
      color: var(--muted);
      background: var(--surface-2);
      border-color: var(--line);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy" aria-labelledby="slide-title">
      <p class="eyebrow">趣然电商 · 玩具事业部</p>
      <h1 id="slide-title">AI 商品经营<br>与利润决策助手</h1>
      <p class="subtitle">用固定规则统一利润、推广与补货决策</p>
      <div class="scope"><span class="scope-mark" aria-hidden="true"></span><span><strong>10—20 个真实 SPU</strong> · F01—F09 MVP</span></div>
    </section>

    <aside class="decision-field" aria-label="从授权到结果记录的决策路径">
      <p class="field-label">DECISION PATH</p>
      <div class="path">
        <div class="path-step">
          <span class="step-no">01 · ACCESS</span>
          <strong>唯一 Admin 打通授权入口</strong>
        </div>
        <div class="path-step">
          <span class="step-no">02 · RULES</span>
          <strong>固定规则给出唯一结论</strong>
        </div>
        <div class="path-step">
          <span class="step-no">03 · ACTION</span>
          <strong>进入审核、执行与结果记录</strong>
        </div>
      </div>
      <p class="field-conclusion">从分散报表，到一张可执行清单。</p>
    </aside>

    <div class="page-index" aria-label="页码">01 / 11</div>
    <nav class="nav" aria-label="幻灯片导航">
      <a href="p01.html" aria-label="上一页" aria-disabled="true">←</a>
      <a href="p02.html" aria-label="下一页">→</a>
    </nav>
  </main>
  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p01.html';
      if (event.key === 'ArrowRight') location.href = 'p02.html';
    });
  </script>
</body>
</html>
