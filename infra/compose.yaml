name: profit-decision-dev-infra

services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: profit_decision
      POSTGRES_USER: profit_decision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profit_decision -d profit_decision"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres18-data:
