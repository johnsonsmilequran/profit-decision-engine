name: 生产门禁

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: profit_decision_test
          POSTGRES_USER: profit_decision
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profit_decision -d profit_decision_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://profit_decision:ci-database-password@127.0.0.1:5432/profit_decision_test?sslmode=disable
      DATABASE_URL: postgres://profit_decision:ci-database-password@127.0.0.1:5432/profit_decision_test?sslmode=disable
      POSTGRES_PASSWORD: ci-compose-password
      PUBLIC_BASE_URL: http://127.0.0.1:18093
      WEB_PORT: "18093"
      COOKIE_SECURE: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 验证前端和 OpenAPI 契约
        working-directory: web
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- src/generated/api.ts
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: 迁移空数据库
        working-directory: backend
        run: go run ./cmd/migrate

      - name: 验证 Go 服务
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./cmd/... ./internal/...
          go test -race -count=1 ./cmd/... ./internal/...
          go build ./cmd/...

      - name: 构建并启动生产 Compose
        run: docker compose -p profit-decision-ci up --build -d

      - name: 验证生产健康与同源入口
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18093/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose -p profit-decision-ci ps
              docker compose -p profit-decision-ci logs --no-color
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18093/health/live
          curl --fail --silent http://127.0.0.1:18093/login | grep -F '<div id="root"></div>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18093/api/session)" = "401"

      - name: 失败时输出 Compose 日志
        if: failure()
        run: |
          docker compose -p profit-decision-ci ps
          docker compose -p profit-decision-ci logs --no-color
