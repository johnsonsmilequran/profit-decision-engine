<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品设计｜固定规则负责判定，AI 负责表达</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --ink: #101214;
      --muted: #5C6470;
      --panel: #EDEDED;
      --rule: #B8BCC4;
      --accent: #6DCBF4;
      --accent-strong: #3D8DFF;
      --font: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
    .stage {
      position: relative;
      width: 1920px;
      min-height: 1080px;
      overflow: hidden;
      transform-origin: top left;
      background: var(--bg);
    }
    .page {
      height: 1080px;
      padding: 76px 96px 48px;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 28px;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule);
    }
    .eyebrow,
    .section {
      margin: 0;
      font-size: 20px;
      letter-spacing: .12em;
    }
    .eyebrow { color: var(--accent-strong); font-weight: 700; }
    .section { color: var(--muted); }
    .headline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 48px;
    }
    h1 {
      margin: 0;
      max-width: 1230px;
      font-size: 70px;
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .headline p {
      margin: 0 0 8px;
      max-width: 400px;
      color: var(--muted);
      font-size: 25px;
      line-height: 1.5;
      text-align: right;
    }
    .boundary-board {
      display: grid;
      grid-template-columns: 1fr 112px 1fr;
      min-height: 0;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .side {
      padding: 34px 40px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
      min-width: 0;
    }
    .side.ai { background: var(--panel); }
    .role {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .role-label {
      color: var(--accent-strong);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .role-result {
      padding: 10px 15px;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-size: 19px;
      font-weight: 700;
    }
    .side h2 {
      margin: 0;
      font-size: 42px;
      line-height: 1.15;
    }
    .items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-content: end;
    }
    .item {
      min-height: 105px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      border-top: 4px solid var(--accent);
      background: var(--bg);
      font-size: 23px;
      line-height: 1.35;
      font-weight: 700;
    }
    .boundary {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      background: var(--accent);
    }
    .boundary::before {
      content: "";
      position: absolute;
      top: 28px;
      bottom: 28px;
      left: 50%;
      width: 4px;
      background: var(--accent-strong);
    }
    .boundary span {
      position: relative;
      z-index: 1;
      padding: 16px 10px;
      border: 1px solid var(--accent-strong);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      writing-mode: vertical-rl;
      letter-spacing: .14em;
    }
    .priority {
      min-height: 94px;
      display: grid;
      grid-template-columns: 260px 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 18px 22px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .priority-label {
      color: var(--muted);
      font-size: 20px;
      letter-spacing: .08em;
    }
    .priority strong {
      font-size: 31px;
      letter-spacing: .02em;
    }
    .guardrail {
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      font-size: 21px;
      font-weight: 700;
    }
    .footer {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 28px;
      min-height: 42px;
      color: var(--muted);
      font-size: 18px;
    }
    .brand { color: var(--ink); font-weight: 700; }
    .page-no { font-variant-numeric: tabular-nums; }
    .nav { display: flex; gap: 8px; }
    .nav a {
      width: 48px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--ink);
      background: var(--bg);
      text-decoration: none;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="page">
      <header class="topline">
        <p class="eyebrow">PRODUCT DESIGN 01</p>
        <p class="section">05 · 规则与 AI 边界</p>
      </header>

      <section class="headline">
        <h1>固定规则负责判定<br>AI 负责表达</h1>
        <p>模型失败或漂移，都不能改变主动作。</p>
      </section>

      <section class="boundary-board" aria-label="固定规则与 AI 的职责边界">
        <article class="side rules">
          <div class="role">
            <span class="role-label">FIXED RULES</span>
            <span class="role-result">输出唯一主动作</span>
          </div>
          <h2>决定经营结论</h2>
          <div class="items">
            <div class="item">商品分类</div>
            <div class="item">利润与品退阈值</div>
            <div class="item">动作优先级</div>
            <div class="item">补货冲突</div>
          </div>
        </article>

        <div class="boundary" aria-label="不可越界">
          <span>不可反向改写</span>
        </div>

        <article class="side ai">
          <div class="role">
            <span class="role-label">AI ASSIST</span>
            <span class="role-result">不覆盖主动作</span>
          </div>
          <h2>组织可执行表达</h2>
          <div class="items">
            <div class="item">对象 · 问题</div>
            <div class="item">依据 · 动作</div>
            <div class="item">解释排序</div>
            <div class="item">给出优化提示</div>
          </div>
        </article>
      </section>

      <section class="priority" aria-label="主动作优先级">
        <span class="priority-label">主动作优先级</span>
        <strong>清仓 &gt; 止损 &gt; 观察 &gt; 加投 &gt; 维持</strong>
        <span class="guardrail">模型失败 ≠ 主动作变化</span>
      </section>

      <footer class="footer">
        <span class="brand">AI 商品经营与利润决策助手</span>
        <span class="page-no">05 / 11</span>
        <nav class="nav" aria-label="幻灯片导航">
          <a href="p04.html" aria-label="上一页">←</a>
          <a href="p06.html" aria-label="下一页">→</a>
        </nav>
      </footer>
    </main>
  </div>

  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p04.html';
      if (event.key === 'ArrowRight') location.href = 'p06.html';
    });
  </script>
</body>
</html>
