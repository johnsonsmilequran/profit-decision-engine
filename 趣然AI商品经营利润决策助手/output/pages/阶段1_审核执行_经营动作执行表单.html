<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="page-id" content="PAGE-F06-02"><title>经营动作执行表单</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>

  --motion-fast: 150ms;--motion-base: 200ms;--ease-standard: cubic-bezier(0.2, 0, 0, 1);
  /* ─── Layout ─── */
  --container-max: 1320px;--container-gutter-desktop: 32px;--container-gutter-tablet: 24px;--container-gutter-phone: 16px;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.shell{max-width:1320px;margin:auto}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.badge{padding:4px 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600}.success{color:var(--success);background:color-mix(in oklab,var(--success),var(--surface) 93%)}.danger{color:var(--danger);background:color-mix(in oklab,var(--danger),var(--surface) 93%)}.field{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);outline:none}.field:hover,.field:focus{border-color:var(--accent)}.field:focus{box-shadow:var(--focus-ring)}.track{background:var(--bg);border-radius:var(--radius-md);padding:15px}.btn{min-height:42px;padding:0 18px;border-radius:var(--radius-md);font-weight:600;border:1px solid transparent}.primary{background:var(--accent);color:var(--accent-on)}.primary:hover{background:var(--accent-hover)}.secondary{background:var(--surface);border-color:var(--border)}.secondary:hover{border-color:var(--accent)}button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
</style></head><body><header class="h-16 bg-[var(--surface)] border-b border-[var(--border)] px-8 flex items-center justify-between"><div class="flex items-center gap-4"><div class="w-9 h-9 rounded-lg bg-[var(--fg)] text-[var(--accent-on)] grid place-items-center"><i class="ph ph-trend-up"></i></div><b>趣然经营助手</b><span class="text-[var(--border)]">/</span><span class="text-sm text-[var(--muted)]">行动清单 · 经营动作执行</span></div><div class="text-sm"><b>林晓</b><span class="text-[var(--muted)] ml-2">运营</span></div></header><main class="p-8"><div class="shell grid grid-cols-[minmax(0,1fr)_560px] gap-6"><section><div class="text-xs text-[var(--accent)] font-semibold tracking-widest mb-2">人工轻闭环</div><h1 class="text-2xl font-bold">确认经营动作执行</h1><p class="text-sm text-[var(--muted)] mt-2 mb-6">记录线下真实执行事实，不会自动修改广告、内容或库存系统。</p><div class="card p-6"><div class="flex justify-between"><div><div class="mono text-xs text-[var(--muted)]">SPU 515 · 布乐迪旗舰店</div><h2 class="text-xl font-semibold mt-2">布乐迪忙碌屋多功能益智玩具</h2></div><span class="badge success">建议已通过</span></div><div class="grid grid-cols-[1fr_auto_1fr] gap-3 mt-6"><div class="track border border-[var(--danger)]"><div class="text-xs text-[var(--muted)]">经营动作 · 由你负责</div><div class="text-lg font-bold text-[var(--danger)] mt-2">清仓</div><div class="text-sm mt-2">待执行</div></div><div class="grid place-items-center text-[var(--accent)]"><i class="ph ph-git-branch text-2xl"></i></div><div class="track"><div class="text-xs text-[var(--muted)]">补货动作 · 采购计划</div><div class="text-lg font-bold text-[var(--warn)] mt-2">禁止补货</div><div class="text-sm mt-2">待执行</div></div></div><div class="mt-5 border-t border-[var(--border)] pt-5"><div class="text-sm font-semibold mb-2">关键依据</div><p class="text-sm leading-7 text-[var(--muted)]">上一个完整自然月经营准利润率 <span class="mono text-[var(--danger)]">-12.8%</span>，命中大爆款清仓规则；规则版本 <span class="mono">RULE-2026.08.01</span>。</p></div></div></section><aside class="card overflow-hidden"><div class="px-6 py-5 border-b border-[var(--border)]"><h2 class="text-lg font-semibold">执行信息</h2><p class="text-sm text-[var(--muted)] mt-1">仅更新左侧经营动作轨。</p></div><form class="p-6 space-y-5" onsubmit="event.preventDefault();alert('已记录经营动作执行，采购动作保持不变。')"><label class="block text-sm font-semibold">执行状态 *</label><label class="flex gap-3 p-4 rounded-lg border border-[var(--accent)] bg-[color-mix(in_oklab,var(--accent),var(--surface)_95%)]"><input type="checkbox" checked class="accent-[var(--accent)]"><div><b>确认已执行清仓动作</b><div class="text-xs text-[var(--muted)] mt-1">我已在线下完成或启动该动作</div></div></label><label class="block text-sm font-semibold">实际执行时间 *<input class="field mt-2 mono" type="datetime-local" value="2026-08-03T16:30"></label><label class="block text-sm font-semibold">执行备注 *<textarea class="field mt-2 h-28 resize-none">已下调店铺可售库存并停止新增推广预算，清仓价格方案已同步负责人，后续按周观察库存消化。</textarea></label><label class="block text-sm font-semibold">动作结果摘要 *<textarea class="field mt-2 h-20 resize-none">清仓安排已启动；首批活动库存 860 件。</textarea></label><div class="p-4 rounded-lg border-l-4 border-[var(--accent)] bg-[var(--bg)] text-sm flex gap-3"><i class="ph ph-info mt-1"></i><span>这是人工执行记录，不代表外部广告或库存系统已回执。</span></div><div class="flex justify-between pt-3"><button type="button" class="btn secondary">取消</button><button class="btn primary"><i class="ph ph-check-circle mr-2"></i>确认已执行</button></div><div class="text-xs text-center text-[var(--muted)]">提交版本 <span class="mono">execution v7</span></div></form></aside></div></main>


<script data-page-wiring>
(() => {
  const routes = {"PAGE-F08-01":"阶段1_历史追溯_历史追溯索引.html","PAGE-F06-01":"阶段1_审核执行_建议审核表单.html","PAGE-F06-02":"阶段1_审核执行_经营动作执行表单.html","PAGE-F06-04":"阶段1_审核执行_经营结果记录表单.html","PAGE-F06-03":"阶段1_审核执行_采购动作执行表单.html","PAGE-F00-01":"阶段1_工作台_角色待办工作台.html","PAGE-F01-01":"阶段1_数据批次_批次列表.html","PAGE-F01-03":"阶段1_数据批次_批次详情与校验结果.html","PAGE-F01-02":"阶段1_数据批次_新建数据导入.html","PAGE-F05-02":"阶段1_行动清单_建议详情.html","PAGE-F05-01":"阶段1_行动清单_行动清单列表.html","PAGE-F07-02":"阶段1_身份权限_权限不足.html","PAGE-F07-01":"阶段1_身份权限_钉钉认证门禁.html"};
  const labels = {"工作台":"PAGE-F00-01","数据批次":"PAGE-F01-01","批次管理":"PAGE-F01-01","行动清单":"PAGE-F05-01","历史追溯":"PAGE-F08-01","新建导入":"PAGE-F01-02","导入数据":"PAGE-F01-02","查看批次":"PAGE-F01-03","批次详情":"PAGE-F01-03","查看清单":"PAGE-F05-01","查看详情":"PAGE-F05-02","建议详情":"PAGE-F05-02","审核建议":"PAGE-F06-01","去审核":"PAGE-F06-01","执行经营动作":"PAGE-F06-02","确认经营动作":"PAGE-F06-02","执行采购动作":"PAGE-F06-03","确认采购动作":"PAGE-F06-03","记录经营结果":"PAGE-F06-04","返回建议详情":"PAGE-F05-02","返回工作台":"PAGE-F00-01"};
  const candidates = document.querySelectorAll('a[href="#"], button');
  for (const el of candidates) {
    const text = el.textContent.replace(/\s+/g, ' ').trim();
    const key = Object.keys(labels).find((label) => text === label || text.includes(label));
    const pageId = el.dataset.targetPage || (key && labels[key]);
    if (!pageId || !routes[pageId]) continue;
    if (el.tagName === 'A') el.href = routes[pageId];
    else el.addEventListener('click', () => { location.href = routes[pageId]; });
  }
})();
</script>
