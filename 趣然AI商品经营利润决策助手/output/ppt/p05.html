<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品设计｜固定规则负责判定，AI 负责表达</title>
  <style>
    :root {
      --bg: #f7f8f6;
      --surface: #ffffff;
      --surface-2: #eef1ec;
      --ink: #101713;
      --muted: #657069;
      --line: #d8ded9;
      --accent: #126b4d;
      --accent-2: #dceee6;
      --success: #23845d;
      --warning: #b56a19;
      --danger: #b23a3a;
      --shadow: 0 22px 70px rgba(16, 23, 19, 0.10);
      --radius-sm: 14px;
      --radius-md: 24px;
      --radius-lg: 38px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      min-height: 1080px;
      overflow: hidden;
      transform-origin: top left;
      background: var(--bg);
    }

    .slide {
      height: 100%;
      padding: 68px 96px 46px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 34px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 56px;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: 70px;
      line-height: 1.06;
      letter-spacing: -.04em;
    }

    .header-note {
      max-width: 410px;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 25px;
      font-weight: 600;
      line-height: 1.45;
      text-align: right;
    }

    .content {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 104px;
      gap: 28px;
    }

    .division {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 168px 1fr;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .role {
      min-width: 0;
      padding: 36px 46px 34px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 16px;
    }

    .role.ai { background: var(--surface-2); }

    .role-label {
      color: var(--accent);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .role h2 {
      margin: 0;
      font-size: 44px;
      line-height: 1.12;
      letter-spacing: -.02em;
    }

    .rule-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      align-self: end;
      border-top: 1px solid var(--line);
    }

    .rule-list li {
      min-height: 58px;
      display: grid;
      grid-template-columns: 36px 1fr;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      font-size: 24px;
      font-weight: 650;
      line-height: 1.3;
    }

    .rule-list b {
      color: var(--accent);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .boundary {
      position: relative;
      display: grid;
      place-items: center;
      background: var(--accent-2);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .boundary::before,
    .boundary::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 2px;
      height: 118px;
      background: var(--accent);
    }

    .boundary::before { top: 0; }
    .boundary::after { bottom: 0; }

    .seal {
      position: relative;
      z-index: 1;
      width: 138px;
      height: 138px;
      padding: 20px;
      display: grid;
      place-items: center;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: var(--surface);
      color: var(--accent);
      font-size: 25px;
      font-weight: 850;
      line-height: 1.22;
      text-align: center;
    }

    .priority {
      display: grid;
      grid-template-columns: 240px 1fr 330px;
      align-items: center;
      gap: 26px;
      padding: 20px 28px;
      border-radius: var(--radius-md);
      background: var(--ink);
      color: var(--surface);
    }

    .priority-label {
      color: var(--accent-2);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .priority strong {
      font-size: 31px;
      line-height: 1.2;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .guardrail {
      padding-left: 26px;
      border-left: 1px solid var(--muted);
      color: var(--accent-2);
      font-size: 23px;
      font-weight: 800;
      line-height: 1.25;
      text-align: right;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 28px;
      color: var(--muted);
      font-size: 22px;
    }

    .brand {
      color: var(--ink);
      font-weight: 750;
    }

    .page-no {
      color: var(--ink);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      width: 48px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="slide">
      <header class="header">
        <div>
          <p class="eyebrow">PRODUCT DESIGN 01 · 决策边界</p>
          <h1>固定规则负责判定，AI 负责表达</h1>
        </div>
        <p class="header-note">模型失败或漂移，<br>都不能改变主动作。</p>
      </header>

      <section class="content">
        <div class="division" aria-label="固定规则与 AI 的职责边界">
          <article class="role">
            <span class="role-label">01 · 确定性裁决</span>
            <h2>输出唯一主动作</h2>
            <ul class="rule-list">
              <li><b>01</b><span>商品分类</span></li>
              <li><b>02</b><span>利润与品退阈值</span></li>
              <li><b>03</b><span>动作优先级</span></li>
              <li><b>04</b><span>补货冲突</span></li>
            </ul>
          </article>

          <div class="boundary" aria-label="主动作不可被 AI 改写">
            <div class="seal">主动作<br>不可改写</div>
          </div>

          <article class="role ai">
            <span class="role-label">02 · 生成式表达</span>
            <h2>组织可执行建议</h2>
            <ul class="rule-list">
              <li><b>01</b><span>对象与问题</span></li>
              <li><b>02</b><span>依据与动作</span></li>
              <li><b>03</b><span>解释排序</span></li>
              <li><b>04</b><span>不覆盖主动作的优化提示</span></li>
            </ul>
          </article>
        </div>

        <div class="priority" aria-label="主动作优先级">
          <span class="priority-label">固定规则优先级</span>
          <strong>清仓 &gt; 止损 &gt; 观察 &gt; 加投 &gt; 维持</strong>
          <span class="guardrail">模型失败 ≠ 主动作变化</span>
        </div>
      </section>

      <footer class="footer">
        <span class="brand">AI 商品经营与利润决策助手</span>
        <span class="page-no">05 / 11</span>
        <nav class="nav" aria-label="幻灯片导航">
          <a href="p04.html" aria-label="上一页">←</a>
          <a href="p06.html" aria-label="下一页">→</a>
        </nav>
      </footer>
    </main>
  </div>

  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p04.html';
      if (event.key === 'ArrowRight') location.href = 'p06.html';
    });
  </script>
</body>
</html>
